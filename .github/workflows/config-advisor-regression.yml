name: Config Advisor regression gate

# Any PR that touches the recommender must pass the golden-fixture
# regression suite. Intentional output changes require regenerating
# tests/golden_baseline.json in the same PR (the diff is then visible
# to reviewers, with the reason recorded in the baseline's history).
on:
  pull_request:
    paths:
      - 'utilities/EMR-Serverless-Config-Advisor/emr_s_fine_tuner.py'
      - 'utilities/EMR-Serverless-Config-Advisor/tests/**'
  push:
    branches: [main]
    paths:
      - 'utilities/EMR-Serverless-Config-Advisor/emr_s_fine_tuner.py'
      - 'utilities/EMR-Serverless-Config-Advisor/tests/**'

jobs:
  golden-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recommender dependencies
        run: pip install pandas boto3
      - name: Run golden-fixture regression suite
        working-directory: utilities/EMR-Serverless-Config-Advisor
        run: python3 tests/test_recommender_golden.py
      - name: Run Rule 3 unit tests
        working-directory: utilities/EMR-Serverless-Config-Advisor
        run: python3 tests/test_exec_limits_rule3.py
      - name: Run 32c worker tests
        working-directory: utilities/EMR-Serverless-Config-Advisor
        run: python3 tests/test_worker_32c.py
