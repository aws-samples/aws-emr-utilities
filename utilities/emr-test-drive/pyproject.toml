[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emr-test-drive"
version = "0.1.0"
description = "Compare a Spark workload across two Amazon EMR configurations and report what broke, what got slower, and what it costs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT-0" }
keywords = ["aws", "emr", "spark", "lake-formation", "upgrade", "regression-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Benchmark",
]
dependencies = ["boto3>=1.34", "pyyaml>=6.0"]

[project.scripts]
etd = "etd.cli:main"

[project.urls]
Homepage = "https://github.com/aws-samples/aws-emr-utilities/tree/main/utilities/emr-test-drive"
Issues = "https://github.com/aws-samples/aws-emr-utilities/issues"

[tool.setuptools]
packages = ["etd", "etd.providers", "etd.assets"]


[tool.setuptools.package-data]
etd = ["matrices/*.json"]
